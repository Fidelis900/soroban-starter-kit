services:
  contracts:
    build:
      context: ..
      dockerfile: docker/Dockerfile.contracts
      target: builder
    command: >
      sh -c "for dir in contracts/*/; do
        [ -f \"$$dir/Cargo.toml\" ] && stellar contract build --manifest-path \"$$dir/Cargo.toml\";
      done"
    volumes:
      - ../contracts:/contracts
      - cargo-cache:/usr/local/cargo/registry
    env_file: ../.env
    restart: "no"
    depends_on:
      stellar-node:
        condition: service_healthy

  # Local Stellar / Soroban node (stellar/quickstart)
  stellar-node:
    image: stellar/quickstart:latest
    command: --local --enable-soroban-rpc
    ports:
      - "${LOCAL_RPC_PORT:-8000}:8000"
      - "${LOCAL_HORIZON_PORT:-8001}:8001"
    environment:
      - ENABLE_SOROBAN_RPC=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://localhost:8000/soroban/rpc | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

# To clean the cargo-cache volume (which can grow to several GB), run:
# docker volume rm soroban-starter-kit_cargo-cache

volumes:
  cargo-cache:
