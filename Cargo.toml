[workspace]
members = [
  "benches",
  "contracts/common",
  "contracts/token",
  "contracts/escrow",
  "contracts/vesting",
  "contracts/staking",
  "contracts/multisig",
  "contracts/subscription",
  "contracts/timelock",
  "contracts/nft",
  "contracts/dao",
  "contracts/swap",
  "contracts/crowdfund",
  "contracts/auction",
  "contracts/ballot",
  "contracts/marketplace",
  "contracts/airdrop",
  "contracts/oracle",
  "contracts/lottery",
  "contracts/ballot",
  "contracts/bonding-curve",
  "contracts/wrapped-token",
  "tests",
  "fuzz",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "=27.0.6"
soroban-common = { path = "contracts/common", version = "0.1.0" }
soroban-sdk-testutils = { version = "=21.7.7", package = "soroban-sdk", features = ["testutils"] }
proptest = "=1.6.0"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1

[workspace.package]
description = "Production-ready Soroban smart contract templates"
authors = ["Soroban Templates Contributors"]
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# restriction lints relevant to smart contract safety (issue #704)
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
integer_division = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
std_instead_of_core = "warn"
