[package]
name = "soroban-token-template"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "A production-ready Soroban token contract template"
license.workspace = true

[features]
# All five safety/governance features ship in a normal deployment (see
# docs/deployment-guide.md, "Cargo Feature Defaults"). Deploy with
# `--no-default-features --features <subset>` to opt out.
default = ["pausable", "upgradeable", "capped-supply", "freeze", "transfer-hook"]
pausable = []
upgradeable = []
capped-supply = []
freeze = []
transfer-hook = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
ed25519-dalek = "2"
rand = "0.10"


[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
doc = false

[lints]
workspace = true

# Uncomment to use a local or forked version of soroban-sdk for development
# [patch.crates-io]
# soroban-sdk = { path = "/path/to/local/soroban-sdk" }
# soroban-sdk = { git = "https://github.com/your-fork/soroban-sdk", branch = "your-branch" }