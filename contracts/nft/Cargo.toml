[package]
name = "soroban-nft-template"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "A production-ready Soroban NFT contract template"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
doc = false

# soroban-sdk 28 #[contractimpl] requires unsafe; override workspace forbid.
[lints.rust]
unsafe_code = "allow"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
integer_division = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
std_instead_of_core = "warn"
