[package]
name = "soroban-dao-template"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "A production-ready Soroban DAO governance contract template"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
# `total_supply` (needed for the quorum_bps checks) isn't part of the SEP-41
# `TokenInterface`, so the governance token in these tests must be a contract
# that implements it, like `soroban-token-template`, rather than a bare
# Stellar Asset Contract.
soroban-token-template = { path = "../token" }

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
doc = false

[lints]
workspace = true
