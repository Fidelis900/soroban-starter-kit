name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight; drives the `nightly` job only.
  workflow_dispatch:

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: ./scripts/format-check.sh

  editions:
    name: Contract editions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check Rust edition consistency
        run: ./scripts/check-editions.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          workspaces: |
            contracts/*

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unsafe-audit:
    name: Unsafe code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-geiger-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Scan workspace for unsafe code
        run: cargo geiger --workspace --all-features | tee cargo-geiger-report.md

      - name: Upload cargo-geiger report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-geiger-report
          path: cargo-geiger-report.md
          if-no-files-found: ignore
          retention-days: 14

  clippy-all-features:
    name: Clippy (all feature combos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run clippy across all feature combinations
        run: bash scripts/clippy-all.sh

  list-contracts:
    name: List contracts
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.list-contracts.outputs.contracts }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: list-contracts
        name: List contracts
        run: echo "contracts=$(ls -d contracts/*/ | xargs -n 1 basename | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT

  test:
    name: Tests (${{ matrix.contract }})
    needs: [list-contracts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJson(needs.list-contracts.outputs.contracts) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-tests-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test -p ${{ matrix.contract }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run integration tests
        run: cargo test -p soroban-integration-tests

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Generate coverage summary
        id: coverage
        run: |
          COVERAGE=$(cargo llvm-cov --workspace --json | jq '.data[0].summary.percent_covered')
          echo "percent=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Code coverage: ${COVERAGE}%"

          # Per-contract breakdown: re-run with --json and extract per-file data.
          cargo llvm-cov --workspace --json > coverage_full.json

          # Build a markdown table of coverage per contract package.
          # Each contracts/* crate maps to a distinct set of source files.
          echo "per_contract_table<<TABLEEOF" >> "$GITHUB_OUTPUT"
          python3 - <<'PYEOF'
          import json, os, sys, collections

          with open("coverage_full.json") as f:
              data = json.load(f)

          # Group files by top-level contracts/<name> directory.
          pkg_lines = collections.defaultdict(lambda: [0, 0])  # [covered, total]
          for file_data in data["data"][0].get("files", []):
              filename = file_data.get("filename", "")
              summary = file_data.get("summary", {}).get("lines", {})
              covered = summary.get("covered", 0)
              total = summary.get("count", 0)
              # Map path to package name
              parts = filename.replace("\\", "/").split("/")
              try:
                  ci = parts.index("contracts")
                  pkg = parts[ci + 1]
              except (ValueError, IndexError):
                  if "tests" in parts:
                      pkg = "integration-tests"
                  else:
                      continue
              pkg_lines[pkg][0] += covered
              pkg_lines[pkg][1] += total

          rows = []
          for pkg in sorted(pkg_lines):
              cov, tot = pkg_lines[pkg]
              pct = (cov / tot * 100) if tot > 0 else 0.0
              icon = "✅" if pct >= 80 else "⚠️"
              rows.append(f"| `{pkg}` | {cov} / {tot} | **{pct:.1f}%** {icon} |")

          print("\n".join(rows))
          PYEOF
          echo "TABLEEOF" >> "$GITHUB_OUTPUT"

      - name: Check coverage threshold
        run: |
          COVERAGE="${{ steps.coverage.outputs.percent }}"
          THRESHOLD=80
          echo "Code coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Compute base branch coverage delta
        if: github.event_name == 'pull_request'
        id: base_coverage
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}"
          git checkout "origin/${{ github.base_ref }}"
          BASE=$(cargo llvm-cov --workspace --json | jq '.data[0].summary.percent_covered')
          echo "percent=${BASE}" >> "$GITHUB_OUTPUT"
          git checkout "${{ github.sha }}"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const current = parseFloat('${{ steps.coverage.outputs.percent }}');
            const baseRaw = '${{ steps.base_coverage.outputs.percent }}';
            const base = baseRaw ? parseFloat(baseRaw) : null;
            const delta = base !== null ? (current - base).toFixed(2) : null;
            const deltaStr = delta !== null
              ? (parseFloat(delta) >= 0 ? `+${delta}` : delta)
              : 'n/a';
            const threshold = 80;
            const status = current >= threshold ? '✅' : '❌';
            const perContractTable = `${{ steps.coverage.outputs.per_contract_table }}`;
            const perContractSection = perContractTable
              ? [
                  '',
                  '### Per-contract coverage',
                  '',
                  '| Contract | Lines (covered / total) | Coverage |',
                  '|----------|------------------------|----------|',
                  perContractTable,
                ].join('\n')
              : '';
            const body = [
              '## Code Coverage Report',
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Line coverage | **${current.toFixed(2)}%** ${status} |`,
              `| Threshold | ${threshold}% |`,
              `| Delta vs \`${{ github.base_ref }}\` | ${deltaStr}% |`,
              '',
              `Minimum line coverage of ${threshold}% is ${current >= threshold ? 'met' : '**not met**'}.`,
              perContractSection,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '<!-- coverage-report -->';
            const existing = comments.find(c => c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage_full.json
          retention-days: 30

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [token_fuzz, escrow_initialize, token_mint_burn]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target (10 000 iterations)
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -runs=10000 -max_total_time=120

  deny:
    name: License and Duplicate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2

  audit:
    name: WASM Build and Check
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build all contracts
        run: |
          for dir in contracts/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Building $(basename $dir)..."
              stellar contract build --manifest-path "$dir/Cargo.toml"
            fi
          done

      - name: Check WASM sizes
        run: |
          pip install jq
          python3 .github/scripts/check_wasm_sizes.py .github/wasm_sizes.json 1.05

      - name: Check default-feature exports
        run: python3 .github/scripts/check_feature_exports.py

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-contracts
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  datakey-discriminants:
    name: DataKey Discriminant Stability (${{ matrix.contract }})
    runs-on: ubuntu-latest
    needs: [list-contracts]
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJson(needs.list-contracts.outputs.contracts) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check DataKey discriminants
        run: cargo test -p ${{ matrix.contract }} -- discriminant_tests --nocapture

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

  machete:
    name: Unused dependencies (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete --workspace

  udeps:
    name: Unused dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Pin the nightly toolchain so unused-dependency results are reproducible
      # across runs (cargo-udeps requires nightly).
      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2025-06-15

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-targets

  lockfile:
    name: Cargo.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Fails if Cargo.lock is missing, out of date, or not committed.
      # --locked turns any required lockfile change into an error instead of
      # silently rewriting Cargo.lock.
      - name: Check Cargo.lock is up to date
        run: cargo update --locked --workspace

  semver-check:
    name: Semver Checks (${{ matrix.contract }})
    needs: [list-contracts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJson(needs.list-contracts.outputs.contracts) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-semver-${{ matrix.contract }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # cargo-semver-checks needs something to diff against. We use the
      # default branch (`origin/main`) as the baseline rather than the
      # last crates.io release, since these contract crates aren't
      # published there. If a contract doesn't exist yet on `origin/main`
      # (e.g. it was just added in this PR), there is nothing to compare
      # against — treat that as a first-time check and skip cleanly
      # instead of failing CI setup.
      - name: Check for baseline on default branch
        id: baseline
        run: |
          git fetch origin main --depth=1
          if git show "origin/main:contracts/${{ matrix.contract }}/Cargo.toml" > /dev/null 2>&1; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check ${{ matrix.contract }} for breaking changes
        if: steps.baseline.outputs.has_baseline == 'true'
        run: |
          cargo semver-checks --manifest-path "contracts/${{ matrix.contract }}/Cargo.toml" \
            --baseline-rev origin/main

      - name: Skip semver check (no baseline yet)
        if: steps.baseline.outputs.has_baseline == 'false'
        run: |
          echo "No 'origin/main' baseline found for contracts/${{ matrix.contract }} — this is its first semver check, so there is nothing to diff against yet. Skipping; future changes will be checked against this commit."

  smoke-test:
    name: Smoke Test (local node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, clippy, test]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build contracts
        run: |
          for dir in contracts/*/; do
            [ -f "$dir/Cargo.toml" ] && stellar contract build --manifest-path "$dir/Cargo.toml"
          done

      - name: Start local Stellar node
        run: docker compose -f docker/docker-compose.yml up -d stellar-node

      - name: Wait for Stellar node to be ready
        run: |
          echo "Waiting for local Stellar node..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ && { echo "Node ready after $((i * 5))s"; break; }
            [ "$i" -eq 30 ] && { echo "ERROR: node not ready after 150s"; exit 1; }
            sleep 5
          done

      - name: Configure Stellar identity and fund account
        run: |
          stellar keys generate --global default --network local
          ADDR=$(stellar keys address default)
          echo "Funding $ADDR via Friendbot..."
          curl -sSf "http://localhost:8000/friendbot?addr=${ADDR}" > /dev/null || \
            curl -sSf "http://localhost:8001/friendbot?addr=${ADDR}" > /dev/null

      - name: Deploy contracts to local node
        run: ./scripts/deploy.sh local

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh local

      - name: Stop local Stellar node
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # Builds the entire workspace (every crate, every target: libs, bins, tests,
  # benches) on every push and pull request. This is the check that must be
  # marked "required" in branch protection on `main` — see CONTRIBUTING.md
  # ("Why `main` can end up with code that doesn't compile") for the incident
  # this job exists to prevent. Unlike `audit` (which builds each contract's
  # WASM individually) or the old `nightly` job (which only ran once a week,
  # long after a bad merge could land), this job runs synchronously on every
  # push/PR and covers the whole workspace in one `cargo build` invocation, so
  # cross-crate breakage can't slip through between contracts.
  build:
    name: Build (workspace, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    # `schedule` is a workflow-level trigger, not a job-level one: this job
    # runs whenever the workflow runs (which now includes every push and PR,
    # per the top-level `on:` block below), so it is gated to the scheduled
    # event explicitly. This also runs `cargo test`, which `build` above does
    # not, so it stays as a slower, weekly, non-blocking cross-check.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Compile all contracts
        run: cargo build --workspace --all-targets
      - name: Test all contracts
        run: cargo test --workspace --all-targets
      - name: Report failure
        if: ${{ failure() }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly build failed',
              body: `The nightly build failed. Please investigate: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug'],
            });

  soroban-sdk-next:
    name: Soroban SDK Next Version Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-next-sdk-${{ hashFiles('**/Cargo.lock') }}

      - name: Update to next soroban-sdk version
        run: |
          cargo update -p soroban-sdk --aggressive

      - name: Build with next SDK version
        run: cargo build --workspace --all-targets

      - name: Run tests with next SDK version
        run: cargo test --workspace
        continue-on-error: true

      - name: Run clippy with next SDK version
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true
