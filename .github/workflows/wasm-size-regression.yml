name: WASM Size Budget and Regression Check

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  wasm-size:
    name: Optimized WASM size budget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: 1.91.0
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pinned Stellar CLI
        run: cargo install --locked stellar-cli@21.7.7 --features opt

      - name: Measure pull request contracts
        run: ./scripts/contract-size-report.sh --limit-bytes 65536 --json-out "$RUNNER_TEMP/current-sizes.json"

      - name: Measure base revision contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base-worktree" "$BASE_SHA"
          cd "$RUNNER_TEMP/base-worktree"
          ./scripts/contract-size-report.sh --limit-bytes 65536 --json-out "$RUNNER_TEMP/base-sizes.json"

      - name: Enforce WASM size budgets
        run: |
          python3 .github/scripts/check_wasm_sizes.py \
            --budgets .github/wasm_sizes.json \
            --base "$RUNNER_TEMP/base-sizes.json" \
            --current "$RUNNER_TEMP/current-sizes.json" \
            --summary-out "$RUNNER_TEMP/wasm-size-summary.md"

      - name: Post WASM size comparison comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: wasm-size-budget
          path: ${{ runner.temp }}/wasm-size-summary.md
