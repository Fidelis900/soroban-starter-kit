name: WASM Size Budget and Regression Check

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-size:
    name: Optimized WASM size budget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: 1.91.0
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pinned Stellar CLI
        run: cargo install --locked stellar-cli@21.7.7 --features opt

      - name: Measure pull request contracts
        run: ./scripts/contract-size-report.sh --limit-bytes 65536 --json-out "$RUNNER_TEMP/current-sizes.json"

      - name: Measure base revision contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base-worktree" "$BASE_SHA"
          cd "$RUNNER_TEMP/base-worktree"
          ./scripts/contract-size-report.sh --limit-bytes 65536 --json-out "$RUNNER_TEMP/base-sizes.json"

      - name: Reject optimized WASM size regressions
        run: |
          python3 - "$RUNNER_TEMP/base-sizes.json" "$RUNNER_TEMP/current-sizes.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              base = json.load(source)
          with open(sys.argv[2], encoding="utf-8") as source:
              current = json.load(source)

          base_sizes = base["contracts"]
          current_sizes = current["contracts"]
          failures = []

          for name in sorted(set(base_sizes) | set(current_sizes)):
              if name not in current_sizes:
                  failures.append(f"{name}: contract disappeared from current build")
                  continue
              size = current_sizes[name]
              if name not in base_sizes:
                  print(f"NEW {name}: {size} bytes")
                  continue
              previous = base_sizes[name]
              delta = size - previous
              print(f"{name}: {previous} -> {size} bytes ({delta:+d})")
              if delta > 0:
                  failures.append(f"{name}: optimized WASM grew by {delta} bytes ({previous} -> {size})")

          if failures:
              print("\nWASM size regression check failed:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("\nNo optimized WASM size regressions detected.")
          PY
